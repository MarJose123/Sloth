name: "Android Release Build"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g., 1.2.3). Uses latest release tag if empty."
        required: false
        type: string

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔖 Resolve version & build
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          fi

          # Get total commit count as build number
          BUILD_NUMBER=$(git rev-list --count HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"
          echo "Build number: ${BUILD_NUMBER}"

      - name: 📝 Update app.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"

          jq --arg v "$VERSION" --arg b "$BUILD" \
            '.expo.version = $v | .expo.androidBuildNumber = ($b | tonumber)' \
            app.json > app.json.tmp
          mv app.json.tmp app.json

          echo "Updated app.json:"
          jq '.expo | {version, androidBuildNumber}' app.json

      - name: 🔍 Resolve previous tag
        id: previous-tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
            echo "Previous tag resolved: ${PREVIOUS_TAG}"
          else
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
            echo "No previous tag found — this is the first release"
          fi

      - name: 📝 Commit version & build update to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }}) [skip ci]"
          file_pattern: app.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          branch: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Get bun cache directory path
        id: bun-cache-dir-path
        run: echo "dir=$(bun pm cache)" >> $GITHUB_OUTPUT

      - name: 📦 Setup bun cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies & EAS CLI
        run: |
          bun install
          bun add -g eas-cli

      - name: 🔄 Verify EAS CLI installation
        run: eas --version

      - name: 📱 Build Release APK (eas build --local)
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --clear-cache \
            --output=./app-release.apk
        env:
          NODE_ENV: production

      - name: ✅ Verify APK was created
        run: |
          if [ -f "./app-release.apk" ]; then
            ls -lh ./app-release.apk
            echo "APK file size: $(du -h ./app-release.apk | cut -f1)"
          else
            echo "ERROR: APK file not found!"
            exit 1
          fi

      - name: 📦 Upload APK as release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ./app-release.apk
          tag_name: ${{ github.event.release.tag_name }}
          name: Release ${{ steps.version.outputs.version }} (Build ${{ steps.version.outputs.build }})
          body: |
            **Version:** ${{ steps.version.outputs.version }}
            **Build:** ${{ steps.version.outputs.build }}
            **Date:** ${{ steps.version.outputs.build_date }}

            Built with `eas build --local` profile: production

            ## Installation

            1. Download the APK file below
            2. Transfer to your Android device
            3. Open file manager and tap the APK to install
            4. Or use `adb install app-release.apk` from Android SDK

            **Note:** You may need to enable "Install from Unknown Sources" in Settings > Security on your device.
          generate_release_notes: true
          previous_tag: ${{ steps.previous-tag.outputs.previous_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Upload APK as workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sloth-release-v${{ steps.version.outputs.version }}-build${{ steps.version.outputs.build }}
          path: ./app-release.apk
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "=== Sloth Release Build Summary ==="
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Build: ${{ steps.version.outputs.build }}"
          echo "Date: ${{ steps.version.outputs.build_date }}"
          echo "Commit: ${{ github.sha }}"
          echo "====================================="
